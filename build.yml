name: Build ADM (windows/amd64) and optional sign

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build adm.exe (windows/amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Build for windows/amd64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          echo "Building adm.exe..."
          go build -ldflags="-s -w" -o dist/adm.exe main.go
          ls -la dist

      - name: Upload unsigned artifact
        uses: actions/upload-artifact@v4
        with:
          name: adm-windows-amd64
          path: dist/adm.exe

  sign:
    name: Optional: Sign adm.exe (requires CODE_SIGN_PFX and CODE_SIGN_PASSWORD secrets)
    runs-on: ubuntu-latest
    needs: build
    if: ${{ secrets.CODE_SIGN_PFX && secrets.CODE_SIGN_PASSWORD }}
    steps:
      - name: Download built artifact
        uses: actions/download-artifact@v4
        with:
          name: adm-windows-amd64
          path: dist

      - name: Install osslsigncode
        run: |
          sudo apt-get update -y
          sudo apt-get install -y osslsigncode

      - name: Decode PFX secret to file
        env:
          PFX_BASE64: ${{ secrets.CODE_SIGN_PFX }}
        run: |
          echo "$PFX_BASE64" | base64 -d > cert.pfx
          ls -la cert.pfx

      - name: Sign with osslsigncode (timestamped)
        env:
          PFX_PASS: ${{ secrets.CODE_SIGN_PASSWORD }}
        run: |
          # Adjust -n (name) and -i (url) to suit your product metadata
          osslsigncode sign -pkcs12 cert.pfx -pass "$PFX_PASS" \
            -n "ADM" -i "https://advancedapp.kz/" \
            -in dist/adm.exe -out dist/adm-signed.exe \
            -t http://timestamp.digicert.com

      - name: Upload signed artifact
        uses: actions/upload-artifact@v4
        with:
          name: adm-windows-amd64-signed
          path: dist/adm-signed.exe